function externalRank(w,i){return w.pairs.map((p,j)=>({p,j,s:w.sub[`${j}:${i}`]})).filter(x=>['verified','done'].includes(x.s?.status)&&x.s.scores?.length===2).map(x=>({...x,total:x.s.scores.reduce((a,b)=>a+b,0)})).sort((a,b)=>i===0?Math.abs(a.total-7777)-Math.abs(b.total-7777):i===5?a.total-b.total:b.total-a.total);}
function externalWinners(w,i){let r=externalRank(w,i);if(!r.length)return [];if(i===10){let middle=new Set([r[Math.floor((r.length-1)/2)].total,r[Math.floor(r.length/2)].total]);return r.filter(x=>middle.has(x.total));}let val=x=>i===0?Math.abs(x.total-7777):x.total;return r.filter(x=>val(x)===val(r[0]));}

function gameRules(kind){const rules={
reaction:`<details class="rulesheet" open><summary>게임 방법 · 사장님 몰래 휴대폰 보기</summary><div class="rulebody"><ol><li><b>몰래 쉬기</b>를 누르면 휴대폰 화면이 나타납니다. 아직 아무 버튼도 누르지 마세요.</li><li>잠시 후 사장님이 등장하면 4×4 화면의 무작위 칸에 <b>⌂ HOME</b> 버튼이 나타납니다. 다른 앱 아이콘도 함께 표시됩니다.</li><li>1.5초 안에 HOME 버튼을 최대한 빨리 누르세요. 다른 버튼을 누르거나 미리 누르면 실패합니다.</li><li>각자 3회 도전하며, 성공한 기록 중 가장 빠른 기록을 사용합니다.</li></ol><div class="ruleexample"><b>예시</b><br>A: 320ms · B: 345ms → 합산 665ms → 성공!</div><div class="rulegoal"><b>도장 조건</b> · 두 사람의 최고 반응속도 합 700ms 이내. 도중에 창을 닫아도 횟수는 차감됩니다.</div></div></details>`,

fly:`<details class="rulesheet" open><summary>게임 방법 · 파리 위치 기억하기</summary><div class="rulebody"><ol><li>6×6 바닥에 파리가 <b>1초 동안</b> 나타납니다. 위치를 기억하세요.</li><li>파리가 사라지면 빨간색과 파란색 파리채가 두 칸을 표시합니다.</li><li><b>빨간 칸부터</b> 그 자리에 원래 파리가 있었다면 <b>잡았다</b>, 없었다면 <b>놓쳤다</b>를 선택하세요. 이어서 파란 칸을 판단합니다.</li><li>각 판단은 3초 이내. 시간이 지나면 오답입니다. 5라운드에 총 10번 판단하며 파리 수는 4마리에서 18마리로 늘어납니다.</li></ol><div class="ruleexample"><b>예시 · 3×2 축소 화면</b><div class="fly-demo"><div><div class="fly-mini"><span>🪰</span><span></span><span>🪰</span><span></span><span>🪰</span><span></span></div><small>파리 등장 (1초)</small></div><b>→</b><div><div class="fly-mini"><span class="red">✦</span><span></span><span></span><span></span><span></span><span class="blue">✦</span></div><small>파리채 등장</small></div></div>빨간 칸: 파리가 있었음 → <b>잡았다</b><br>파란 칸: 비어 있었음 → <b>놓쳤다</b></div><div class="rulegoal"><b>도장 조건</b> · 각자 실전 2회, 두 사람의 최고 정답 개수 합이 14/20 이상. 연습은 무제한이며 매 판단 정답을 알려줍니다. 실전은 종료 후 점수만 표시합니다.</div></div></details>`,
